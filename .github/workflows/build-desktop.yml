name: Windows Winlator Friendly App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Standard (.exe)
    runs-on: windows-latest
    env:
      PYINSTALLER_ONEFILE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: LFS Pull
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktopapp/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd desktopapp
          pyinstaller build.spec --clean --noconfirm
        shell: bash

      - name: Archive production artifacts
        shell: powershell
        run: |
          $tempDir = Join-Path $env:GITHUB_WORKSPACE "final_dist"
          New-Item -ItemType Directory -Path $tempDir -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "desktopapp\dist\AcuteStrokeSegmentation.exe") -Destination $tempDir
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "best_unet.pt") -Destination $tempDir
          $destination = Join-Path $env:GITHUB_WORKSPACE "stroke-segmentation-win64.zip"
          Compress-Archive -Path "$tempDir\*" -DestinationPath $destination -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stroke-segmentation-desktop-win64
          path: stroke-segmentation-win64.zip
          retention-days: 30

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Upload to Google Drive
        run: |
          rclone copy stroke-segmentation-win64.zip gdrive:builds/

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    env:
      PYINSTALLER_ONEFILE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: LFS Pull
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglu1-mesa libegl1 \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinput0 libxkbcommon0 \
            libglib2.0-0 libxcb-xkb1 libxcb-shm0 libdbus-1-3 \
            libx11-6 libxext6 libxfixes3 libxi6 libxrender1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktopapp/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd desktopapp
          pyinstaller build.spec --clean --noconfirm
        shell: bash

      - name: Archive production artifacts
        run: |
          cd desktopapp/dist
          zip -r ../../stroke-segmentation-linux.zip AcuteStrokeSegmentation
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stroke-segmentation-desktop-linux
          path: stroke-segmentation-linux.zip
          retention-days: 30

  build-winlator:
    name: Build Windows Winlator Friendly (Portable Folder)
    runs-on: windows-latest
    env:
      PYINSTALLER_ONEFILE: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: LFS Pull
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktopapp/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd desktopapp
          pyinstaller build.spec --clean --noconfirm
        shell: bash

      - name: Archive production artifacts
        shell: bash
        run: |
          cp best_unet.pt desktopapp/dist/AcuteStrokeSegmentation/
          cd desktopapp/dist
          7z a ../../stroke-segmentation-winlator.7z AcuteStrokeSegmentation

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stroke-segmentation-desktop-winlator
          path: stroke-segmentation-winlator.7z
          retention-days: 30
